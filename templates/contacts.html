{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0 section-title">Kontakty</h1>
    <a class="btn btn-primary" href="{{ url_for('new_contact') }}">Nový kontakt</a>
</div>
<div class="card">
    <div class="card-body p-0">
        <table class="table mb-0 align-middle">
            <thead class="table-light">
                <tr>
                    <th class="ps-4">Meno</th>
                    <th>Email</th>
                    <th>Telefón</th>
                    <th class="text-end pe-4">Akcia</th>
                </tr>
            </thead>
            <tbody>
                {% for contact in contacts %}
                <tr>
                    <td class="ps-4 fw-semibold">{{ contact.name }}</td>
                    <td class="text-muted">{{ contact.email or '—' }}</td>
                    <td class="text-muted">{{ contact.phone or '—' }}</td>
                    <td class="text-end pe-4">
                        <div class="d-inline-flex flex-wrap gap-2">
                            <a class="btn btn-sm btn-outline-primary" href="{{ url_for('contact_detail', contact_id=contact.id)}}">Otvoriť</a>
                            <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('edit_contact', contact_id=contact.id)}}">Upraviť</a>
                            <form method="post" action="{{ url_for('delete_contact', contact_id=contact.id) }}" onsubmit="return confirm('Naozaj chcete vymazať tento kontakt?');">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Vymazať</button>
                            </form>
                        </div>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="4" class="text-center text-muted py-4">Žiadne kontakty</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
