{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Kontakty</h1>
    <a class="btn btn-primary" href="{{ url_for('new_contact') }}">Nový kontakt</a>
</div>
<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table mb-0">
            <thead class="table-light">
                <tr>
                    <th>Meno</th>
                    <th>Email</th>
                    <th>Telefón</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for contact in contacts %}
                <tr>
                    <td>{{ contact.name }}</td>
                    <td>{{ contact.email }}</td>
                    <td>{{ contact.phone }}</td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-primary" href="{{ url_for('contact_detail', contact_id=contact.id) }}">Otvoriť</a></td>
                </tr>
                {% else %}
                <tr><td colspan="4" class="text-center text-muted">Žiadne kontakty</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
